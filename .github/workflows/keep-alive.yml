name: Keep Render Alive

on:
  schedule:
    # Render free services sleep after inactivity; this external check wakes them.
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Simply Music
        run: |
          set -euo pipefail
          URL="https://pashut-muzika.onrender.com/api/health"
          echo "Pinging ${URL}..."
          curl --fail --silent --show-error --max-time 45 --retry 2 --retry-delay 5 \
            --output /dev/null --write-out "HTTP status: %{http_code}\n" "${URL}"
          echo "Health check completed at $(date -u)"
