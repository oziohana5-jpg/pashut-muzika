# Render.com Blueprint configuration for Simply Music (פשוט מוזיקה)
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: simply-music
    env: node
    plan: starter
    region: frankfurt
    disk:
      name: simply-music-data
      mountPath: /var/data
      sizeGB: 1
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: JWT_SECRET
        generateValue: true
      - key: DATA_DIR
        value: /var/data
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: forteenite
